<html lang="pt-BR">
<head>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5; /* Um cinza claro, mais suave */
            color: #1c1e21; /* Cor de texto escura */
            text-align: center;
        }

        .container {
            max-width: 90%;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #0d6efd; /* Azul moderno */
            animation: spin 1s ease infinite;
            margin: 0 auto 24px auto; /* Centraliza o spinner e dá espaço abaixo */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.6em;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        p {
            font-size: 1.1em;
            color: #606770; /* Cinza mais escuro para melhor leitura */
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1>Aguarde um instante...</h1>
        <p>Estamos preparando tudo para você.</p>
    </div>

    <script>
        function redirecionarParaWhatsApp() {
            const numeroWhatsApp = '5542998619278';
            const mensagens = [
                'Ooi Gata, tudo bem?',
                'OII, quero falar com você agora',
                'Olá, quero te conhecer melhor',
                'E aí, gata! Bora conversar?',
                'Oie, vi seu perfil e me interessei',
                'Olá, vamos nos conhecer?',
                'Oi, te achei interessante',
                'Oie, tá livre pra conversar?',
                'Oi, me chama aqui pra gente conversar',
                'Olá, gostei do seu perfil'
            ];
            const mensagemSorteada = mensagens[Math.floor(Math.random() * mensagens.length)];
            const mensagemCodificada = encodeURIComponent(mensagemSorteada);
            const linkWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${mensagemCodificada}`;
            window.location.href = linkWhatsApp;
        }

        // Tempo de espera antes do redirecionamento
        setTimeout(redirecionarParaWhatsApp, 2000); // 2 segundos
    </script>

</body>
</html>
